name: rencontre
description: App de rencontre + réseau social
publish_to: 'none'
version: 1.0.11+2021

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State management ─────────────────────────────────────────
  get: ^4.6.6
  get_storage: ^2.1.1   
  # ── Cloud & Messaging (Firebase) ─────────────────────────────
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # ── Supabase ──────────────────────────────────────────────────
  supabase_flutter: ^2.5.6

  # ── Auth providers ────────────────────────────────────────────
  google_sign_in: ^6.2.1

  # ── Achats intégrés (RevenueCat) ─────────────────────────────
  purchases_flutter: ^9.15.0

  # ── UI ────────────────────────────────────────────────────────
  google_fonts: ^6.1.0
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1

  # ── Grille façon Pinterest/Snapchat (écran Story) ──────────────
  flutter_staggered_grid_view: ^0.7.0

  # ── Géolocalisation ───────────────────────────────────────────
  geolocator: ^10.1.0

  # ── Notifications ─────────────────────────────────────────────
  awesome_notifications: ^0.10.0

  # ── Carte ─────────────────────────────────────────────────────
  flutter_map: ^7.0.2
  latlong2: ^0.9.0
  flutter_map_marker_cluster: ^1.3.0

  # ── HTTP ──────────────────────────────────────────────────────
  http: ^1.2.0

  # ── Camera & Media ────────────────────────────────────────────
  camera: ^0.11.0
  image: ^4.1.3
  image_picker: ^1.0.7
  file_picker: ^8.0.3
  video_player: ^2.11.0
  video_thumbnail: ^0.5.3

  # ── Audio ─────────────────────────────────────────────────────
  flutter_sound: ^9.2.13
  audioplayers: ^6.1.0
  path_provider: ^2.1.3

  # ── Permissions ───────────────────────────────────────────────
  permission_handler: ^11.3.1

  # ── Sécurité / anti-capture d'écran ──────────────────────────

  # ── Utilitaires ───────────────────────────────────────────────
  timeago: ^3.6.0
  package_info_plus: ^8.0.0
  url_launcher: ^6.3.0
  visibility_detector: ^0.4.0+2
  change_app_package_name: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/logo.png
  adaptive_icon_background: "#0d0d1a"
  adaptive_icon_foreground: assets/images/logo.png
  min_sdk_android: 21